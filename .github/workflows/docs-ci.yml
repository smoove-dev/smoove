name: docs-ci

on:
  pull_request:
    paths:
      - "packages/docs/**"
      - "packages/code/**"
      - "packages/core/**"
      - "packages/effects/**"
      - "packages/google-fonts/**"
      - "packages/lottie/**"
      - "packages/media/**"
      - "packages/player/**"
      - "packages/transitions/**"
      - "packages/vite/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docs-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "packages/code/**"
      - "packages/core/**"
      - "packages/effects/**"
      - "packages/google-fonts/**"
      - "packages/lottie/**"
      - "packages/media/**"
      - "packages/player/**"
      - "packages/transitions/**"
      - "packages/vite/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docs-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "@smoove/docs..." --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm --filter "@smoove/docs..." run build
      - run: pnpm --filter @smoove/docs run typecheck

  # The site is fully static: build it with the demo media pointed at R2,
  # move that media into the R2 bucket, and upload the rest as Workers static
  # assets (no Worker script, so nothing runs per request).
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    env:
      # Public URL of the R2 bucket (its custom domain), e.g. https://media.smoove.dev
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "@smoove/docs..." --frozen-lockfile
      - run: pnpm --filter "@smoove/docs..." run build
      - name: Move demo media to R2
        run: node packages/docs/scripts/upload-media.mjs
      - name: Deploy static assets
        working-directory: packages/docs
        run: npx --yes wrangler@4 deploy
